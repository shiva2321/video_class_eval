models:
  whisper: "large-v3-turbo"
  whisper_dir: 'F:\models\whisper'
  clip: "openai/clip-vit-base-patch32"
  ecapa: "speechbrain/spkrec-ecapa-voxceleb"
  whisper_multilingual: "faster-whisper-large-v3"
  pyannote: "pyannote/speaker-diarization-3.1"
  llm: "qwen3-vl:8b-instruct"

ollama:
  base_url: "http://127.0.0.1:11434"

weights:
  R1: 8
  R2: 10
  R3: 4
  R4: 10
  R5: 5
  R6: 15
  R7: 12
  R8: 15
  R9: 8
  R10: 6
  R11: 4
  R12: 3

groups:
  presentation: ["R1", "R2", "R3", "R12"]
  teaching: ["R4", "R5", "R6", "R7", "R8", "R9", "R10", "R11"]

# Grade boundaries on the 0-100 weighted score. average_lt / good_lt are the midpoints between the mean scores of
# the labelled Average, Good and Excellent classes, rounded; poor_lt is a judgement (no labelled class scored low
# enough to fit it). Ten labelled classes cannot support a precise fit, see README "Evaluation".
cutoffs:
  poor_lt: 65
  average_lt: 75
  good_lt: 80

limits:
  max_upload_bytes: 2684354560
  max_duration_s: 10800
  min_duration_s: 600
  chunk_bytes: 8388608
  job_ttl_hours: 24
  job_lease_s: 1800

sampling:
  frame_fps: 0.2
  frame_width: 640
  keyframes: 24

lexicon:
  greeting:
    - "hello"
    - "hi"
    - "good morning"
    - "good afternoon"
    - "good evening"
    - "welcome"
  rapport:
    - "how are you"
    - "how was"
    - "what did you"
  self_intro:
    - "introduce yourself"
    - "new friend"
    - "welcome to"
    - "tell me your name"
  homework:
    - "homework"
    - "home work"
    - "assignment"
    - "worksheet"
    - "practice sheet"
    - "practice at home"
    - "do at home"
  closing:
    - "bye"
    - "see you"
    - "next class"
    - "thank you"
    - "well done today"

scoring:
  branded_ratio_tutor_speaking: [0.0, 0.7]
  student_words_per_min: [5.0, 45.0]
  dead_air_per_min: [0.8, 0.05]
  distinct_responders: [0.0, 5.0]
  question_reply_rate: [0.2, 0.8]
  pitch_std_semitones: [1.5, 4.0]
  energy_cv: [0.4, 1.0]
  board_share_ratio: [0.15, 0.6]

paths:
  jobs_dir: "jobs"
  uploads_dir: "uploads"

languages:
  full_support: ["en"]

asr:
  device: "cuda"
  compute_type: "int8_float16"
  batch_size: 8
  beam_size: 5
  vad_filter: true
  language_windows: 5
  language_window_s: 30

diarization:
  prefer: "ecapa"
  ecapa_window_s: 1.5
  ecapa_hop_s: 0.75
  ecapa_merge_gap_s: 0.5
  distance_threshold: 0.8
  min_cluster_share: 0.03
  smooth_windows: 0

screen_state:
  flat_card_luma_range: [20, 40]
  flat_card_std_max: 8
  flat_card_pixel_share: 0.92
  logo_match_threshold: 0.6
  logo_scales: [0.35, 0.5, 0.7, 1.0, 1.4, 1.6]
  clip_batch_size: 32
  clip_prompts:
    BOARD_SHARE:
      - "a chess board with pieces"
      - "a chess puzzle shown on a screen"
    LESSON_VIDEO_SHARE:
      - "a video lesson player with a related videos panel"
      - "a video player with a play button and progress bar"
    OTHER_TALKING_HEAD:
      - "a person's face close up on a video call"
    OTHER_SHARE:
      - "a slide or document shown on a screen"
